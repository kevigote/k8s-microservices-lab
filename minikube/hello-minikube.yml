apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-minikube
  labels:
    app: hello-minikube

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-minikube

  template:
    metadata:
      labels:
        app: hello-minikube

    spec:
      containers:
        - name: hello-minikube
          image: nginx

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          env:
            - name: SECRET_MESSAGE
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: message

          command: ["/bin/sh"]

          args:
            - -c
            - |
              echo "
              <!DOCTYPE html>
              <html>
              <body>
                <h1>Hello from Minikube</h1>
                <h2>The secret message is: ${SECRET_MESSAGE}</h2>
              </body>
              </html>
              " > /usr/share/nginx/html/index.html

              nginx -g 'daemon off;'

          ports:
            - containerPort: 80